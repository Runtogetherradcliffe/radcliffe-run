# Keeps the free-tier DEV Supabase project (rnbiqxhlqjbahgiwabuv) from being
# auto-paused for inactivity.
#
# Supabase's inactivity detection counts only traffic through its API gateway
# (REST / Auth). Direct Postgres connections do NOT count - the weekly db-drift
# job connects to dev every Monday and Supabase still sent a pause warning
# (27 Jul 2026). So this job makes a real PostgREST request instead.
#
# Twice weekly, because the pause threshold is ~7 days of inactivity and both
# GitHub schedules and a single weekly run are best-effort: one missed Monday
# must not be enough to get the project paused. Odd minute chosen because
# on-the-hour GitHub schedules are the most delayed.
#
# The request must FAIL the job when it does not get a 200: a keepalive that
# silently stops working looks exactly like one that is working, right up
# until the project is paused.
name: Supabase dev keepalive

on:
  schedule:
    # Mondays and Thursdays, 06:23 UTC.
    - cron: '23 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dev REST API
        env:
          SUPABASE_DEV_URL: https://rnbiqxhlqjbahgiwabuv.supabase.co
          SUPABASE_DEV_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_DEV_ANON_KEY" ]; then
            echo "SUPABASE_DEV_ANON_KEY secret is not set" >&2
            exit 1
          fi
          # A real table read through PostgREST. RLS may filter the rows; the
          # gateway hit is what counts, but only a 200 proves the project is
          # up and the key valid.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_DEV_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_DEV_ANON_KEY" \
            "$SUPABASE_DEV_URL/rest/v1/runs?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Keepalive ping failed - dev project may be paused or the key rotated" >&2
            exit 1
          fi
